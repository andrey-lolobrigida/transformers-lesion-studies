[project]
name = "transformers-lesion-studies"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.1",
    "transformer-lens>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs the GPU and the real model (network on first run)"]
